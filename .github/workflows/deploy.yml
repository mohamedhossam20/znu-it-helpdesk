name: Deploy

# Every push to main goes live on the server. The runner is self-hosted on the
# server itself (as the app user "helpdesk"), so no SSH keys or open ports are needed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, it-helpdesk]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash deploy/deploy.sh main
