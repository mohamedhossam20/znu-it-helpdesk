# ZNU IT Helpdesk — one domain serves both apps:
#   /                     → Vue PWA (pwa/dist), SPA fallback to index.html
#   /api /admin /sanctum /broadcasting /livewire /admin-tools /up → Laravel
#   /app                  → Laravel Reverb (WebSockets)
#
# Paths assume releases in /var/www/it-helpdesk/current (see deploy/deploy.sh).
# TLS: terminate here with certbot, or keep this on 127.0.0.1:80 behind
# Cloudflare Tunnel like ZNU Portal does (then trust CF-Connecting-IP below).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name it.znu.edu.eg;

    set $app /var/www/it-helpdesk/current;
    root $app/pwa/dist;
    index index.html;

    charset utf-8;
    client_max_body_size 30m;   # 5 photos x 5 MB + form data

    # Behind Cloudflare: real visitor address for logs and rate limiting.
    # set_real_ip_from 127.0.0.1;
    # real_ip_header CF-Connecting-IP;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Laravel ---------------------------------------------------------
    location ~ ^/(api|admin|admin-tools|sanctum|broadcasting|livewire|up)(/|$) {
        root $app/backend/public;
        try_files $uri /index.php?$query_string;
    }

    # Assets published by Filament / Livewire into backend/public.
    location ~ ^/(css|js|fonts)/(filament|livewire)/ {
        root $app/backend/public;
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location = /index.php {
        root $app/backend/public;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    # ---- Reverb ----------------------------------------------------------
    location /app {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }

    # Laravel publishes events straight to 127.0.0.1:8080 (REVERB_HOST in
    # backend .env), so Reverb's HTTP API is never exposed here.

    # ---- PWA -------------------------------------------------------------
    # The service worker and manifest must never be cached, or updates stall.
    location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
