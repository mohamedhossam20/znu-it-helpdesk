; Background processes for ZNU IT Helpdesk.
; Copy to /etc/supervisor/conf.d/ then: supervisorctl reread && supervisorctl update

[program:it-helpdesk-queue]
command=php /var/www/it-helpdesk/current/backend/artisan queue:work --sleep=2 --tries=3 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=2
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/var/www/it-helpdesk/shared/storage/logs/queue.log

[program:it-helpdesk-reverb]
command=php /var/www/it-helpdesk/current/backend/artisan reverb:start --host=127.0.0.1 --port=8080
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/it-helpdesk/shared/storage/logs/reverb.log
; Each open browser tab holds one socket.
minfds=10240
